name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHPCS (WordPress standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint

  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Parse every PHP file
        run: |
          list() { find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './reference/*' -not -path './bin/*' -print0; }
          echo "checking $(list | tr -cd '\0' | wc -c) files"
          list | xargs -0 -n1 php -l > /dev/null

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test:unit

  assets:
    name: JS/CSS bundles and size budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Committed bundles are up to date
        run: |
          changes=$(git status --porcelain -- assets)
          if [ -n "$changes" ]; then
            echo "assets differ from a fresh bundle (changed or untracked files):" >&2
            echo "$changes" >&2
            exit 1
          fi
      - run: npm run size

  node-tests:
    name: Node tests (deep scan, known database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Deep scan tool
        working-directory: tools/deep-scan
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Known database tools
        working-directory: tools/build-known-db
        run: npm test
      - name: Preset is generated from its definition
        run: node tools/build-known-db/build-preset.mjs --check

  deep-scan-image:
    name: Deep scan Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t dscc-deep-scan:ci tools/deep-scan
      - name: The image starts
        run: docker run --rm dscc-deep-scan:ci --help

  translations:
    name: Translation catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: The catalog compiles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext
          msgfmt --check --statistics -o /dev/null languages/ds-cookie-consent-vi.po
      - name: The table and the template agree, nothing is untranslated
        run: php tools/i18n/make-vi-po.php languages/ds-cookie-consent.pot "$RUNNER_TEMP/check.po" --strict

  workflows:
    name: Workflow files (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint with the pinned actionlint image
        run: bash tools/release/lint-workflows.sh

  package:
    name: Release package builds
    runs-on: ubuntu-latest
    needs: [php-lint, assets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bash tools/release/build-zip.sh "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ds-cookie-consent-zip
          path: ${{ runner.temp }}/out/ds-cookie-consent.zip
          retention-days: 7
